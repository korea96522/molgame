<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Match — Stealth Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 2rem;
    color: #00ff88;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 0 20px #00ff8844;
  }
  .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 20px; }
  .hud {
    display: flex;
    gap: 30px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: #888;
  }
  .hud span { color: #00ff88; font-weight: bold; }
  #board {
    display: grid;
    gap: 8px;
    margin-bottom: 20px;
  }
  .card {
    width: 70px;
    height: 70px;
    border: 2px solid #333;
    border-radius: 8px;
    background: #111;
    font-size: 1.6rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    transition: all 0.2s;
    user-select: none;
  }
  .card:hover:not(.matched):not(.revealed) { border-color: #00ff8866; background: #151515; }
  .card.revealed { color: #00ff88; border-color: #00ff88; background: #001a0e; }
  .card.matched { color: #fff; border-color: #00ff88; background: #003322; cursor: default; }
  .card.wrong { color: #ff4444; border-color: #ff4444; background: #1a0000; }
  #msg {
    font-size: 1rem;
    color: #00ff88;
    min-height: 24px;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  .controls { display: flex; gap: 12px; }
  button {
    background: transparent;
    border: 1px solid #00ff88;
    color: #00ff88;
    padding: 8px 20px;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  button:hover { background: #00ff8822; }
  .level-select { display: flex; gap: 10px; margin-bottom: 20px; }
  .level-btn {
    border: 1px solid #444;
    color: #666;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    background: transparent;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .level-btn.active { border-color: #00ff88; color: #00ff88; }
  a.back {
    color: #444;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 2px;
    margin-top: 20px;
    transition: color 0.2s;
  }
  a.back:hover { color: #00ff88; }
  #win-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0fcc;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    backdrop-filter: blur(4px);
  }
  #win-screen.show { display: flex; }
  #win-screen h2 { font-size: 2.5rem; color: #00ff88; letter-spacing: 6px; }
  #win-screen p { color: #888; }
</style>
</head>
<body>
<h1>Number Match</h1>
<p class="subtitle">Find all matching pairs</p>

<div class="level-select">
  <button class="level-btn active" onclick="setLevel(4,4,this)">4×4</button>
  <button class="level-btn" onclick="setLevel(4,6,this)">4×6</button>
  <button class="level-btn" onclick="setLevel(6,6,this)">6×6</button>
</div>

<div class="hud">
  Moves: <span id="moves">0</span>
  &nbsp;|&nbsp;
  Pairs: <span id="pairs">0</span> / <span id="total">0</span>
  &nbsp;|&nbsp;
  Time: <span id="timer">0s</span>
</div>

<div id="board"></div>
<div id="msg"></div>
<div class="controls">
  <button onclick="startGame()">New Game</button>
</div>
<a class="back" href="stealth-games-hub.html">← Back to Hub</a>

<div id="win-screen">
  <h2>MATCHED!</h2>
  <p id="win-stats"></p>
  <button onclick="startGame(); document.getElementById('win-screen').classList.remove('show')">Play Again</button>
  <a class="back" href="stealth-games-hub.html">← Back to Hub</a>
</div>

<script>
let cols = 4, rows = 4;
let cards = [], revealed = [], matched = 0, moves = 0;
let locked = false, timerInterval = null, seconds = 0;

function setLevel(c, r, btn) {
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  cols = c; rows = r;
  startGame();
}

function startGame() {
  clearInterval(timerInterval);
  seconds = 0; moves = 0; matched = 0;
  revealed = []; locked = false;
  const total = cols * rows;
  const pairs = total / 2;
  const nums = Array.from({length: pairs}, (_, i) => i + 1);
  cards = shuffle([...nums, ...nums]);
  document.getElementById('total').textContent = pairs;
  document.getElementById('pairs').textContent = 0;
  document.getElementById('moves').textContent = 0;
  document.getElementById('timer').textContent = '0s';
  document.getElementById('msg').textContent = '';
  renderBoard();
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = seconds + 's';
  }, 1000);
}

function renderBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${cols}, 70px)`;
  board.innerHTML = '';
  cards.forEach((val, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.dataset.value = val;
    card.textContent = val;
    card.addEventListener('click', () => flipCard(card));
    board.appendChild(card);
  });
}

function flipCard(card) {
  const i = +card.dataset.index;
  if (locked || card.classList.contains('matched') || revealed.includes(i)) return;
  card.classList.add('revealed');
  revealed.push(i);
  if (revealed.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    locked = true;
    const [a, b] = revealed.map(idx => document.querySelector(`.card[data-index="${idx}"]`));
    if (a.dataset.value === b.dataset.value) {
      setTimeout(() => {
        a.classList.remove('revealed'); b.classList.remove('revealed');
        a.classList.add('matched'); b.classList.add('matched');
        matched++;
        document.getElementById('pairs').textContent = matched;
        revealed = []; locked = false;
        if (matched === cards.length / 2) winGame();
      }, 400);
    } else {
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(() => {
        a.classList.remove('revealed','wrong'); b.classList.remove('revealed','wrong');
        revealed = []; locked = false;
      }, 700);
    }
  }
}

function winGame() {
  clearInterval(timerInterval);
  document.getElementById('win-stats').textContent =
    `${moves} moves · ${seconds}s · ${cols}×${rows}`;
  document.getElementById('win-screen').classList.add('show');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

startGame();
</script>
</body>
</html>
