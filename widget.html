<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Stealth Games Widget</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a0f;
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
}

/* ── TAB BAR ── */
#tabs {
  display: flex;
  height: 40px;
  flex-shrink: 0;
  background: #0d0d18;
  border-bottom: 1px solid #1a1a2e;
  user-select: none;
}
.tab {
  flex: 1;
  background: transparent;
  border: none;
  border-right: 1px solid #1a1a2e;
  border-bottom: 2px solid transparent;
  color: #444;
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.tab:last-of-type { border-right: none; }
.tab:hover { background: #111122; color: #888; }
.tab.active {
  background: #0a0a0f;
  color: #fff;
  border-bottom-color: var(--accent);
}

/* ── POPOUT BUTTON ── */
#btn-popout {
  width: 40px;
  background: transparent;
  border: none;
  border-left: 1px solid #1a1a2e;
  color: #333;
  font-size: 0.75rem;
  cursor: pointer;
  transition: color .15s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#btn-popout:hover { color: #00ff88; }

/* ── FRAME AREA ── */
#frames {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
}
iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 360px;
  height: 540px;
  border: none;
  display: none;
  transform-origin: top left;
}
iframe.active { display: block; }

/* ── LOADING INDICATOR ── */
.loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
  font-size: 0.75rem;
  letter-spacing: 3px;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="tabs">
  <button class="tab active" style="--accent:#ff88cc" onclick="switchTab(0)" title="미니 펫">🐾</button>
  <button class="tab"        style="--accent:#aa44ff" onclick="switchTab(1)" title="펫 점프">🦘</button>
  <button class="tab"        style="--accent:#00ff88" onclick="switchTab(2)" title="숫자 맞추기">🔢</button>
  <button class="tab"        style="--accent:#00aaff" onclick="switchTab(3)" title="타이핑">⌨️</button>
  <button class="tab"        style="--accent:#ffaa00" onclick="switchTab(4)" title="2048">🔲</button>
  <button class="tab"        style="--accent:#ffaa00" onclick="switchTab(5)" title="슬롯머신">🎰</button>
  <button id="btn-popout" onclick="popout()" title="새 창으로 열기">⊞</button>
</div>

<div id="frames">
  <div class="loading" id="loading-0"></div>
  <div class="loading" id="loading-1">loading...</div>
  <div class="loading" id="loading-2">loading...</div>
  <div class="loading" id="loading-3">loading...</div>
  <div class="loading" id="loading-4">loading...</div>
  <div class="loading" id="loading-5">loading...</div>
  <iframe id="f0" class="active" src="mini-pet.html?widget=1"></iframe>
  <iframe id="f1" src=""></iframe>
  <iframe id="f2" src=""></iframe>
  <iframe id="f3" src=""></iframe>
  <iframe id="f4" src=""></iframe>
  <iframe id="f5" src=""></iframe>
</div>

<script>
const SRCS = [
  'mini-pet.html?widget=1',
  'pet-jump.html?widget=1',
  'number-match.html?widget=1',
  'typing-race.html?widget=1',
  'mini-2048.html?widget=1',
  'slot-machine.html?widget=1',
];

const tabs    = document.querySelectorAll('.tab:not(#btn-popout)');
const frames  = [0,1,2,3,4,5].map(i => document.getElementById('f'+i));
const loaders = [0,1,2,3,4,5].map(i => document.getElementById('loading-'+i));
let current = 0;

// Hide loader when iframe loads
frames.forEach((fr, i) => {
  fr.addEventListener('load', () => {
    if (loaders[i]) loaders[i].style.display = 'none';
  });
});

function switchTab(i) {
  if (i === current) return;
  tabs[current].classList.remove('active');
  frames[current].classList.remove('active');
  current = i;
  tabs[i].classList.add('active');
  // Lazy-load: set src on first visit
  if (!frames[i].src || frames[i].src === location.href) {
    frames[i].src = SRCS[i];
  }
  frames[i].classList.add('active');
  // Route keyboard events into the active game
  setTimeout(() => frames[i].focus(), 80);
}

function popout() {
  window.open(
    'widget.html',
    'stealth_widget',
    'width=360,height=600,toolbar=0,menubar=0,location=0,status=0,scrollbars=0,resizable=1'
  );
}

// ── RESPONSIVE SCALING ──
// Games are designed at 360×540. Scale to fit the actual frame area.
function scaleFrames() {
  const availW = document.getElementById('frames').clientWidth;
  const availH = document.getElementById('frames').clientHeight;
  const scale = Math.min(availW / 360, availH / 540);
  frames.forEach(f => {
    f.style.transform = `scale(${scale})`;
  });
}

window.addEventListener('resize', scaleFrames);
scaleFrames();
</script>
</body>
</html>
